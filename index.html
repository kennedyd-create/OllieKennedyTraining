<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ollie Kennedy Training Log</title>
<meta name="description" content="Ollie Kennedy's training log: workouts, PBs and progress.">
<meta name="theme-color" content="#0b1f4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ollie Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: navy "plate-loaded" banner with live stats, then two big mode tabs; input = stacked cards, tracking = tile row + chart grid.
   Colour: steel neutrals + Olympic bumper-plate colours as category codes (red push, blue pull, yellow legs, green cardio, grey other), gold for PBs. */
:root{
  --bg:#eceff5; --surface:#ffffff; --surface-2:#f4f6fa; --surface-3:#e5e9f1;
  --ink:#111a2e; --ink-soft:#525d77; --ink-faint:#7c869c;
  --line:#d9dfea; --line-strong:#c0c9d9;
  --navy:#0b1f4d; --navy-2:#132b66; --on-navy:#ffffff; --on-navy-soft:#b7c4e4;
  --gold:#b8892a; --gold-wash:#f7efdc; --gold-ink:#7a5a12;
  --push:#d8342c; --pull:#2c62d6; --legs:#d99e00; --cardio:#1e9e5a; --other:#76819a;
  --ok:#15803d; --warn:#b45309; --bad:#b91c1c;
  --shadow:0 1px 2px rgba(17,26,46,.06),0 6px 20px rgba(17,26,46,.06);
  --display:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --pop:#b42318; --pop-2:#8f1c13; --pop-tag:#ffd7a3;
  --combo:#7c3aed; --free:#0e8f9a;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#080e1c; --surface:#111a2e; --surface-2:#16223b; --surface-3:#1d2b49;
  --ink:#e6ebf5; --ink-soft:#a0abc2; --ink-faint:#76829b;
  --line:#22304e; --line-strong:#33456b;
  --navy:#0f2457; --navy-2:#173273; --on-navy:#ffffff; --on-navy-soft:#b7c4e4;
  --gold:#e2bb66; --gold-wash:#2b2413; --gold-ink:#f2d58f;
  --push:#f0574d; --pull:#6694ff; --legs:#f5c33b; --cardio:#3ccf7f; --other:#9aa4b8;
  --ok:#4ade80; --warn:#fbbf24; --bad:#fca5a5;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --pop:#a8261c; --pop-2:#7d1a12; --pop-tag:#ffd7a3; --combo:#a78bfa; --free:#2cc4cf;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080e1c; --surface:#111a2e; --surface-2:#16223b; --surface-3:#1d2b49;
  --ink:#e6ebf5; --ink-soft:#a0abc2; --ink-faint:#76829b;
  --line:#22304e; --line-strong:#33456b;
  --navy:#0f2457; --navy-2:#173273; --on-navy:#ffffff; --on-navy-soft:#b7c4e4;
  --gold:#e2bb66; --gold-wash:#2b2413; --gold-ink:#f2d58f;
  --push:#f0574d; --pull:#6694ff; --legs:#f5c33b; --cardio:#3ccf7f; --other:#9aa4b8;
  --ok:#4ade80; --warn:#fbbf24; --bad:#fca5a5;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --pop:#a8261c; --pop-2:#7d1a12; --pop-tag:#ffd7a3; --combo:#a78bfa; --free:#2cc4cf;
  color-scheme:dark}
*{box-sizing:border-box}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- Banner ---------- */
.banner{background:var(--navy);color:var(--on-navy);position:relative;overflow:hidden}
.banner::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;
  background:linear-gradient(90deg,var(--push) 0 20%,var(--pull) 20% 40%,var(--legs) 40% 60%,var(--cardio) 60% 80%,#e8ecf3 80% 100%)}
.banner .wrap{padding-block:calc(22px + env(safe-area-inset-top,0px)) 28px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 28px;align-items:end}
.who .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--on-navy-soft);font-weight:700}
.who h1{font-family:var(--display);font-weight:900;font-size:clamp(44px,8vw,78px);line-height:.88;margin:6px 0 8px;letter-spacing:.01em;text-transform:uppercase}
.who .meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--on-navy-soft);font-size:13px}
.who .meta b{color:var(--on-navy);font-weight:700}
.pbchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1);font-weight:700;font-size:12px;color:var(--on-navy)}
.pbchip.live{background:#e2bb66;color:#2a1d00}
.linkbtn{background:none;border:0;color:var(--on-navy-soft);text-decoration:underline;cursor:pointer;padding:0;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(6,minmax(96px,1fr));gap:8px}
.stat{background:var(--navy-2);border-radius:12px;padding:10px 12px 9px;min-width:0}
.stat .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-navy-soft);font-weight:700;white-space:nowrap}
.stat .v{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.05;margin-top:2px}
.stat .v small{font-family:var(--font);font-size:12px;font-weight:600;color:var(--on-navy-soft);margin-left:3px}
.stat .d{font-size:11px;color:var(--on-navy-soft)}
.stat.pb .k{color:#e2bb66}
@media (max-width:900px){.banner .wrap{grid-template-columns:1fr}.stats{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (max-width:760px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat .v{font-size:26px}}

/* ---------- Mode tabs ---------- */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0 18px}
.mode{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.mode .n{font-family:var(--display);font-weight:900;font-size:34px;line-height:1;color:var(--ink-faint)}
.mode .t{font-weight:800;font-size:16px}
.mode .s{font-size:12.5px;color:var(--ink-soft)}
.mode[aria-selected="true"]{border-color:var(--navy);background:var(--navy);color:var(--on-navy)}
:root .mode[aria-selected="true"] .s{color:var(--on-navy-soft)}
.mode[aria-selected="true"] .n{color:#e2bb66}
@media (max-width:520px){.mode .s{display:none}.mode{padding:12px}}

/* ---------- Cards / controls ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h2{font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 4px;line-height:1.05;text-wrap:balance}
.card h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 10px;color:var(--ink-soft);font-weight:800}
.hint{color:var(--ink-soft);font-size:13px;margin:0}
.stack{display:grid;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
label.f{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.04em;text-transform:uppercase}
input[type=date],input[type=time],input[type=number],input[type=text],select{background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;font-size:15px}
input:focus{border-color:var(--pull);outline:none}
input[type=number]{font-family:var(--mono)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:11px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:800;cursor:pointer;font-size:14px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1f1600}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.type{padding:16px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);cursor:pointer;text-align:left;display:grid;gap:2px}
.type .tt{font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1}
.type .ts{font-size:12px;color:var(--ink-soft)}
[hidden]{display:none!important}
@media (max-width:520px){.types{gap:6px}.type{padding:12px 8px}.type .tt{font-size:18px}.type .ts{font-size:11px}}
.type[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.type .plate{width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 6px color-mix(in srgb,var(--c) 70%,#000);margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface-2);font-weight:800;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--c,var(--navy));border-color:var(--c,var(--navy));color:#fff}
.seg.small button{padding:6px 13px;font-size:13px}
.split-push{--c:var(--push)}.split-pull{--c:var(--pull)}.split-legs{--c:var(--legs)}.split-pushpull{--c:var(--combo)}.split-free{--c:var(--free)}.c-cardio{--c:var(--cardio)}.c-other{--c:var(--other)}
:root .split-legs[aria-pressed="true"]{color:#1f1600}

/* exercise cards */
.exlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.ex{border:1.5px solid var(--line);border-radius:12px;background:var(--surface-2);padding:12px 12px 10px;min-width:0;border-left:5px solid var(--c)}
.ex.off{opacity:.55}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-name{font-weight:800;font-size:15.5px}
.ex-last{font-size:11.5px;color:var(--ink-faint);font-family:var(--mono)}
.ex-ctrl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:10px 0 8px;font-size:13px}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.stepper button{width:30px;height:30px;border:0;background:none;cursor:pointer;font-weight:800;font-size:16px}
.stepper span{min-width:46px;text-align:center;font-weight:700;font-size:13px}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;user-select:none}
.chk input{width:17px;height:17px;accent-color:var(--navy)}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.set .sn{font-family:var(--mono);font-size:12px;color:var(--ink-faint);font-weight:700}
.set input[type=number]{width:100%;padding:7px 9px;font-size:14px;background:var(--surface)}
.set .fail{font-size:11.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.set .fail input{accent-color:var(--push)}
.sethead{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr) auto;gap:8px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:7px 12px;border-radius:999px;border:1.5px dashed var(--line-strong);background:var(--surface);cursor:pointer;font-weight:700;font-size:13px}
.chip[aria-pressed="true"]{border-style:solid;border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.intens{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:460px}
.intens button{padding:10px 0 6px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);cursor:pointer;display:grid;gap:0;justify-items:center}
.intens button b{font-family:var(--display);font-size:24px;line-height:1}
.intens button span{font-size:10px;color:var(--ink-soft);font-weight:700}
.intens button[aria-pressed="true"]{background:var(--ic);border-color:var(--ic);color:#fff}
.intens button[aria-pressed="true"] span{color:#fff}
.savebar{position:sticky;bottom:0;padding-bottom:max(12px,env(safe-area-inset-bottom,0px));padding-top:12px;background:linear-gradient(transparent,var(--bg) 35%);display:flex;justify-content:flex-end;gap:10px;align-items:center;z-index:5}
.err{color:var(--bad);font-weight:700;font-size:13px}

/* ---------- Tracking ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.tile .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-weight:800}
.tile .v{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.05}
.tile .d{font-size:12px;color:var(--ink-faint)}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.grid3{grid-template-columns:1fr}}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.chartbox{position:relative;height:240px}
.chartbox.tall{height:280px}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--ink-faint);font-size:13px;padding:20px;border:1.5px dashed var(--line);border-radius:10px}
.pbcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;border-radius:var(--r);padding:16px 18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.pbcard.live{background:var(--gold-wash);border-color:var(--gold)}
.pbcard .medal{width:52px;height:52px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-family:var(--display);font-weight:900;color:#1f1600;font-size:20px;box-shadow:inset 0 0 0 5px color-mix(in srgb,var(--gold) 65%,#000)}
.pbcard h2{font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;margin:0;line-height:1.05}
@media (max-width:560px){.pbcard{grid-template-columns:auto minmax(0,1fr)}.pbcard .btn{grid-column:1/-1}}
.insights{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.insights li{display:grid;grid-template-columns:10px minmax(0,1fr);gap:12px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:14px}
.insights li::before{content:"";width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--ink-faint)}
.insights li.good::before{background:var(--ok)}
.insights li.warn::before{background:var(--warn)}
.insights li.pb::before{background:var(--gold)}
.cal{display:grid;grid-template-columns:28px repeat(12,minmax(0,1fr));gap:4px;font-size:10px;color:var(--ink-faint)}
.cal .day{aspect-ratio:1;border-radius:4px;background:var(--surface-3);max-width:100%}
.cal .lbl{display:flex;align-items:center;font-weight:700}
.cal .wk{text-align:center;font-weight:700;font-family:var(--mono);font-size:9px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-soft);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hist{display:grid;gap:8px}
.hrow{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.hrow .bar{align-self:stretch;border-radius:4px;background:var(--c)}
.hrow .ht{font-weight:800}
.hrow .hd{font-size:12.5px;color:var(--ink-soft);overflow-wrap:anywhere}
.tiplist{display:grid;gap:8px}
.tipmini{padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13.5px}
.tipmini b{display:block}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--ink-soft)}
.notice{font-size:12.5px;color:var(--ink-soft);text-align:center;padding:18px 0 30px}

/* ---------- Modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,10,24,.62);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .18s ease}
.modal{background:var(--surface);color:var(--ink);border-radius:18px;max-width:560px;width:100%;max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
.modal .mh{padding:20px 22px 16px;background:linear-gradient(135deg,var(--pop),var(--pop-2));color:var(--on-navy);position:relative}
.modal .mh .tag{color:var(--pop-tag)}
.modal .btn.primary{background:var(--pop);border-color:var(--pop);color:#fff}
.modal .readbox input{accent-color:var(--pop)}
.modal blockquote{border-left-color:var(--pop)}
.modal .mh h2{font-family:var(--display);font-weight:900;font-size:34px;line-height:.98;text-transform:uppercase;margin:6px 0 0;text-wrap:balance}
.modal .mb{padding:18px 22px 22px;display:grid;gap:14px}
.modal .mb p{margin:0;font-size:15.5px;max-width:62ch}
.modal blockquote{margin:0;font-size:21px;line-height:1.35;font-weight:600;border-left:4px solid var(--gold);padding-left:14px}
.modal cite{font-style:normal;font-weight:800;color:var(--ink-soft);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.modal .mf{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding-top:6px;border-top:1px solid var(--line)}
.readbox{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line-strong);cursor:pointer;font-weight:800}
.readbox input{width:20px;height:20px;accent-color:var(--cardio)}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.formgrid input{width:100%}
@media (max-width:440px){.formgrid{grid-template-columns:1fr}}
.pbres{display:grid;gap:6px}
.pbres div{padding:9px 12px;border-radius:10px;background:var(--surface-2);font-weight:700}
.pbres div.new{background:var(--gold-wash);color:var(--gold-ink)}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:700;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}}
@media (prefers-reduced-motion:reduce){.scrim,.modal{animation:none}}
</style>
</head>
<body>
<header class="banner">
  <div class="wrap">
    <div class="who">
      <div class="eyebrow">Training log</div>
      <h1>Ollie Kennedy</h1>
      <div class="meta">
        <span>Age <b id="b-age">—</b></span>
        <span id="b-pb" class="pbchip">Next PB Week —</span>
        <button class="linkbtn" id="b-tip" type="button">Today's tip</button>
        <button class="linkbtn" id="b-edit" type="button">Edit profile</button>
      </div>
    </div>
    <div class="stats" id="b-stats"></div>
  </div>
</header>

<main class="wrap">
  <div class="modes" role="tablist">

<script>
/* =========================================================
   CONTENT
   ========================================================= */
const EXERCISES = {
  push:{ normal:["Incline Dumbbell Press","Bench Press","Tricep Pushdowns","Shoulder Press","Cable Lateral Raises"],
         other:["Flat Dumbbell Press","Decline Bench Press","Machine Chest Press","Cable Chest Fly","Pec Deck","Dips","Push-Ups","Close-Grip Bench Press","Arnold Press","Front Raises","Dumbbell Lateral Raises","Overhead Tricep Extension","Skull Crushers","Landmine Press"] },
  pull:{ normal:["Lat Pulldown","Wide Grip Row","Close Grip Row","Bicep Curl","Hammer Curl"],
         other:["Pull-Ups","Chin-Ups","Barbell Row","Single-Arm Dumbbell Row","T-Bar Row","Landmine Row","Face Pulls","Straight-Arm Pulldown","Rear Delt Fly","Preacher Curl","Incline Dumbbell Curl","Cable Curl","Shrugs","Deadlift"] },
  legs:{ normal:["Bulgarian Split Squats","Romanian Deadlift","Calf Raises","Decline Ab Crunches"],
         other:["Back Squat","Front Squat","Goblet Squat","Landmine Squat","Leg Press","Leg Extension","Hamstring Curl","Walking Lunges","Step-Ups","Hip Thrust","Seated Calf Raise","Kettlebell Swings","Turkish Get-Up","Hanging Leg Raises","Cable Woodchoppers","Plank"] }
};
const SPLITS = {push:"Push",pull:"Pull",legs:"Legs",pushpull:"Push/Pull",free:"Free Session"};
const BASE_SPLITS=["push","pull","legs"];
const uniq=a=>[...new Set(a)];
/* Push/Pull combo = both normal workouts + both libraries. Free Session = no set exercises; the whole library to pick from. */
EXERCISES.pushpull={normal:[...EXERCISES.push.normal,...EXERCISES.pull.normal],other:uniq([...EXERCISES.push.other,...EXERCISES.pull.other])};
EXERCISES.free={normal:[],other:uniq(BASE_SPLITS.flatMap(k=>[...EXERCISES[k].normal,...EXERCISES[k].other]))};
const splitTitle=k=>k==="free"?"Free session":`${SPLITS[k]} day`;
const CARDIO = ["Walk","Run","Row","Cycle"];
const INTENSITY = ["Very easy","Easy","Steady","Hard","Very hard","Max"];
const OTHER_SUGGEST = ["Basketball","Football","Touch rugby","Swimming","Surfing","Hiking","Tennis","Volleyball","Mountain biking","Kayaking","Boxing","Yoga"];

/* Tip deck: ~75 pop-ups ≈ 2–3 a week for six months. `again` = also scheduled again later. */
const TIPS = [
 // Quotes
 {id:"q1",cat:"Quote",title:"Where growth happens",quote:"The last three or four reps is what makes the muscle grow.",by:"Arnold Schwarzenegger, Pumping Iron (1977)",body:"Those hard final reps are why the 'To failure' box exists. Use it honestly and you'll see which sets really pushed you."},
 {id:"q2",cat:"Quote",title:"Stimulate, don't annihilate",quote:"Exercise to stimulate, not annihilate.",by:"Lee Haney, 8× Mr. Olympia",body:"More is not always better. Leave the gym having worked hard, not wrecked, so you can train again in two days."},
 {id:"q3",cat:"Quote",title:"One kick, 10,000 times",quote:"I fear not the man who has practiced 10,000 kicks once, but I fear the man who has practiced one kick 10,000 times.",by:"Bruce Lee",body:"Your normal Push, Pull and Legs days are your 10,000 kicks. Repeating them well is what builds the numbers in the banner."},
 {id:"q4",cat:"Quote",title:"Suffer now",quote:"I hated every minute of training, but I said, 'Don't quit. Suffer now and live the rest of your life as a champion.'",by:"Muhammad Ali",body:"Not every session will feel good. The ones you turn up for anyway count the most."},
 {id:"q5",cat:"Quote",title:"The only place you live",quote:"Take care of your body. It's the only place you have to live.",by:"Jim Rohn",body:"Training, food, sleep and stretching all go into the same body. Look after all four."},
 {id:"q6",cat:"Quote",title:"Keep the goal the goal",quote:"The goal is to keep the goal the goal.",by:"Dan John, strength coach",body:"Pick what matters this block (a bench PB, more pull-ups, bigger arms) and don't let shiny new programmes distract you."},
 {id:"q7",cat:"Quote",title:"Not trying is the failure",quote:"I can accept failure, everyone fails at something. But I can't accept not trying.",by:"Michael Jordan",body:"A missed rep on a PB attempt is still a win. Not attempting it isn't."},
 {id:"q8",cat:"Quote",title:"Strength is a skill",quote:"Strength is a skill.",by:"Pavel Tsatsouline, kettlebell coach",body:"You get better at lifting the same way you get better at shooting hoops: frequent, focused practice with good technique."},
 {id:"q9",cat:"Quote",title:"Struggle builds strength",quote:"Strength does not come from winning. Your struggles develop your strengths.",by:"Arnold Schwarzenegger",body:"A plateau is normal. Check your Performance Tracking graphs and change one thing: reps, rest, or an exercise from the Other tab."},
 {id:"q10",cat:"Quote",title:"Light weight, baby",quote:"Yeah buddy! Light weight!",by:"Ronnie Coleman, 8× Mr. Olympia",body:"Ronnie shouted this under enormous loads to stay confident. Attitude is part of the lift. Back yourself on the next heavy set."},
 // Nutrition
 {id:"n1",cat:"Nutrition",title:"Protein, spread out",body:"Muscle is built from protein. A good target for someone lifting regularly is roughly 1.6 g per kg of body weight a day, split across 3–4 meals rather than all at dinner."},
 {id:"n2",cat:"Nutrition",title:"Start the day with protein",body:"Most people eat little protein at breakfast. Eggs, Greek yoghurt, milk with oats, or peanut butter on toast give you an early 20–30 g."},
 {id:"n3",cat:"Nutrition",title:"Refuel after training",body:"Within a couple of hours of a session, eat a meal with both carbs and protein: chicken and rice, a mince wrap, or a big glass of milk and a sandwich."},
 {id:"n4",cat:"Nutrition",title:"Carbs are fuel",body:"Carbohydrates fill the muscle's energy stores. Rice, potatoes, pasta, bread, fruit and oats make heavy sets and long cardio feel easier. Don't cut them to 'look lean'."},
 {id:"n5",cat:"Nutrition",title:"Check your hydration",body:"Even mild dehydration lowers strength and focus. Bring a bottle to every session and aim for pale-yellow urine through the day."},
 {id:"n6",cat:"Nutrition",title:"Eat the rainbow",body:"Different coloured vegetables and fruit bring different vitamins and minerals. Try to get three colours on your plate at dinner."},
 {id:"n7",cat:"Nutrition",title:"Milk is a recovery drink",body:"Plain or chocolate milk has protein, carbs, fluid and electrolytes. It's one of the best-studied, cheapest post-workout drinks there is."},
 {id:"n8",cat:"Nutrition",title:"Healthy fats matter",body:"Fats help make hormones and absorb vitamins. Avocado, nuts, olive oil, salmon and eggs are all good sources."},
 {id:"n9",cat:"Nutrition",title:"Snack with a purpose",body:"Good snacks between meals: a tub of yoghurt, a banana and peanut butter, tuna and crackers, boiled eggs, or a handful of nuts. Better than chips or lollies."},
 {id:"n10",cat:"Nutrition",title:"Go easy on energy drinks",body:"High-caffeine energy drinks can wreck sleep and make your heart race. Sleep does more for performance than any pre-workout can."},
 {id:"n11",cat:"Nutrition",title:"Eat enough to grow",body:"If your weight graph is flat and you want to build muscle, you probably need a bit more food. An extra snack or bigger portions at two meals is a simple start."},
 {id:"n12",cat:"Nutrition",title:"Fibre keeps you going",body:"Wholegrain bread, oats, beans, fruit and veg keep energy steady and digestion happy. Aim for some at every meal."},
 // Long and Strong / mobility
 {id:"m1",cat:"Long and Strong",title:"Muscles need to be long and strong",body:"Strength without flexibility leads to tight hips, sore backs and shoulder niggles. Finish every session with 5–10 minutes of stretching the muscles you just trained.",again:2},
 {id:"m2",cat:"Long and Strong",title:"Dynamic before, static after",body:"Before lifting, warm up with movement: leg swings, arm circles, light sets. Save long held stretches (30–60 s) for the end of the session."},
 {id:"m3",cat:"Long and Strong",title:"Open your hip flexors",body:"Bulgarian split squats load the hips hard. Afterwards try a half-kneeling hip-flexor stretch: squeeze the back glute, tuck the pelvis, hold 45 s each side."},
 {id:"m4",cat:"Long and Strong",title:"Hamstrings for better RDLs",body:"Tight hamstrings limit your Romanian deadlift range. Lie on your back with a towel round one foot and pull the straight leg up for 45 s each side."},
 {id:"m5",cat:"Long and Strong",title:"Doorway pec stretch",body:"Bench and incline press tighten the chest and roll the shoulders forward. Forearm on a door frame, step through gently, hold 30–45 s each side."},
 {id:"m6",cat:"Long and Strong",title:"Hang it out",body:"A dead hang from the pull-up bar stretches your lats and decompresses your spine. Build up to 3 × 30 s at the end of Pull day."},
 {id:"m7",cat:"Long and Strong",title:"Thoracic spine openers",body:"A stiff upper back makes overhead pressing harder. Try open-book rotations lying on your side: 8 slow reps each way before Push day."},
 {id:"m8",cat:"Long and Strong",title:"Ankle mobility",body:"Good ankle bend means deeper, safer squats and split squats. Knee-to-wall drill: foot a hand's length from the wall, drive the knee forward, 10 reps each side."},
 {id:"m9",cat:"Long and Strong",title:"90/90 hip switches",body:"Sit with both knees bent at 90°, one in front, one to the side. Rotate side to side for 10 reps. Great for hips that sit at a desk all day."},
 {id:"m10",cat:"Long and Strong",title:"Couch stretch",body:"Back knee against a couch or wall, front foot forward, squeeze the glute. Brutal on the quads and hip flexors, and a great one after Legs day."},
 // Try this exercise
 {id:"e1",cat:"Try this exercise",title:"Face pulls",body:"Rope on a high cable, pull to your forehead with elbows high and thumbs back. Balances all that pressing and keeps shoulders healthy. Try 3 × 15 on Pull day.",again:1},
 {id:"e2",cat:"Try this exercise",title:"Pull-ups for your PB",body:"Add 3 sets of pull-ups at the start of Pull day, stopping 1–2 reps before failure. Frequent practice is the fastest way to raise your pull-up PB."},
 {id:"e3",cat:"Try this exercise",title:"Incline dumbbell curl",body:"Sit back on a 45° bench and let the arms hang. The stretch on the bicep makes this one of the best curls for growth. Find it under Pull → Other."},
 {id:"e4",cat:"Try this exercise",title:"Arnold press",body:"Start with palms facing you, rotate them out as you press overhead. Hits all three parts of the shoulder. Swap it in for your normal shoulder press one week."},
 {id:"e5",cat:"Try this exercise",title:"Hip thrust",body:"Upper back on a bench, bar over the hips, drive up and squeeze the glutes. Strong glutes help sprinting, jumping and your split squats."},
 {id:"e6",cat:"Try this exercise",title:"Dips",body:"Lean slightly forward for more chest, stay upright for more triceps. A great bodyweight Push exercise. Log weight as 0 if you're not adding any."},
 {id:"e7",cat:"Try this exercise",title:"Pallof press",body:"Stand side-on to a cable, hold the handle at your chest and press straight out without letting it twist you. Anti-rotation core work for basketball and lifting."},
 {id:"e8",cat:"Try this exercise",title:"Farmer's carry",body:"Pick up heavy dumbbells and walk 30–40 m with tall posture. It builds grip, traps and core all at once. Finish Pull or Legs day with 3 carries."},
 {id:"e9",cat:"Try this exercise",title:"Nordic hamstring curl",body:"Kneel with your ankles anchored and lower your body forward as slowly as you can. One of the best-researched exercises for preventing hamstring strains."},
 {id:"e10",cat:"Try this exercise",title:"Copenhagen plank",body:"Side plank with your top leg on a bench. Strengthens the inner thigh, which helps protect the groin when you cut and change direction."},
 {id:"e11",cat:"Try this exercise",title:"Single-arm dumbbell row",body:"One hand and knee on a bench, row the dumbbell to your hip. Working one side at a time fixes imbalances that machines can hide."},
 {id:"e12",cat:"Try this exercise",title:"Goblet squat",body:"Hold a dumbbell at your chest and sit between your heels. A great warm-up for Legs day and a check on your squat depth."},
 {id:"e13",cat:"Try this exercise",title:"Chin-ups",body:"Palms facing you shifts more work onto the biceps. Rotating chin-ups into Pull day is a sneaky way to grow your arms."},
 // Dynamic work
 {id:"d1",cat:"Dynamic work",title:"Turkish Get-Up",body:"Lie down holding a kettlebell straight up, then stand up step by step without letting the arm bend, and reverse it. It builds shoulder stability, core and coordination. Start light: 3 slow reps each side.",again:3},
 {id:"d2",cat:"Dynamic work",title:"Landmine press",body:"Wedge one end of a barbell into a corner or landmine and press the other end up and forward. Shoulder-friendly pressing with a natural arc. Try 3 × 8 each arm on Push day.",again:2},
 {id:"d3",cat:"Dynamic work",title:"Landmine rotations",body:"Hold the end of a landmine bar overhead with both hands and swing it in an arc from hip to hip, turning through the feet. Rotational power for passing and shooting."},
 {id:"d4",cat:"Dynamic work",title:"Kettlebell swing",body:"Hinge at the hips like an RDL, then snap them forward to float the bell to chest height. Fast, explosive and brilliant for the posterior chain. 5 × 15 after Legs day.",again:1},
 {id:"d5",cat:"Dynamic work",title:"Medicine ball slams",body:"Lift the ball overhead, then slam it into the floor as hard as you can. Full-body power and a great finisher. 4 × 8 with full effort."},
 {id:"d6",cat:"Dynamic work",title:"Box jumps",body:"Jump onto a box and step down, never jump down. Focus on a soft landing. 4 × 5 at the start of Legs day while you're fresh builds explosiveness."},
 {id:"d7",cat:"Dynamic work",title:"Sled push",body:"If the gym has a sled, push it 20 m with low hips and long strides. Huge leg drive with almost no soreness the next day."},
 {id:"d8",cat:"Dynamic work",title:"Bear crawls",body:"Hands and toes on the floor, knees just off the ground, crawl forward and back 10 m. A great warm-up for shoulders, core and coordination."},
 {id:"d9",cat:"Dynamic work",title:"Battle ropes",body:"Alternate fast waves for 20 s, rest 40 s, repeat 6 times. Conditioning that hammers shoulders and lungs in under 10 minutes."},
 {id:"d10",cat:"Dynamic work",title:"Lateral bounds",body:"Jump sideways off one leg and stick the landing on the other. Builds the side-to-side power and ankle stability used in basketball."},
 // Training & recovery
 {id:"t1",cat:"Training tip",title:"Progressive overload",body:"To keep improving, do a little more over time: one more rep, 2.5 kg more, or an extra set. Check the exercise progress graph to see if your numbers are creeping up."},
 {id:"t2",cat:"Training tip",title:"Save failure for the last set",body:"Going to failure on every set piles up fatigue. Try leaving 1–2 reps in the tank on early sets and only tick 'To failure' on the last one."},
 {id:"t3",cat:"Training tip",title:"Rest long enough",body:"For heavy compound lifts like bench press, rest 2–3 minutes between sets. For curls and lateral raises, 60–90 s is enough."},
 {id:"t4",cat:"Recovery",title:"Sleep is the best supplement",body:"Muscle repairs while you sleep. Aim for 8+ hours, keep your phone out of reach, and keep a regular bedtime even on weekends."},
 {id:"t5",cat:"Training tip",title:"Control the lowering",body:"Take 2–3 seconds to lower each rep. The eccentric (lowering) part builds a lot of muscle and keeps your form honest."},
 {id:"t6",cat:"Training tip",title:"Full range of motion",body:"Half reps let you lift more weight but build less muscle. Lower the bar to your chest, let the lat pulldown go to full stretch, and get deep on split squats."},
 {id:"t7",cat:"Training tip",title:"Warm-up sets",body:"Before your first heavy exercise do 2–3 lighter sets building up to your working weight. They prepare joints and grease the movement."},
 {id:"t8",cat:"Training tip",title:"Brace your core",body:"Before heavy reps, take a big breath into your belly and tighten like you're about to be poked. It protects your back and makes you stronger."},
 {id:"t9",cat:"Recovery",title:"Plan a lighter week",body:"Every 6–8 weeks, try a 'deload': same exercises, about half the sets, lighter weights. You often come back stronger. Good timing is the week after a PB Week."},
 {id:"t10",cat:"Training tip",title:"Balance push and pull",body:"Look at your Performance Tracking breakdown. If Push days outnumber Pull days, your posture and shoulders will notice. Aim for an even split."},
 {id:"t11",cat:"Training tip",title:"Don't skip Legs",body:"Legs are your biggest muscles. Training them boosts overall strength, athleticism and jump height, and it helps upper-body growth too."},
 {id:"t12",cat:"Recovery",title:"Cardio builds your engine",body:"Two easy cardio sessions a week improve recovery between sets and between games. A 30-minute walk or easy cycle counts."},
 {id:"t13",cat:"Mindset",title:"Consistency beats perfect",body:"Three good sessions every week for six months beats one perfect month followed by nothing. Watch the training calendar fill up."},
 {id:"t14",cat:"Mindset",title:"Log every session",body:"What gets measured gets improved. Logging sets, reps and weights here is what makes your progress graphs and insights work."},
 {id:"t15",cat:"Training tip",title:"Grip it tight",body:"Squeeze the bar hard on presses and rows. A strong grip makes the whole arm and shoulder fire harder and keeps the bar steady."},
 {id:"t16",cat:"Recovery",title:"Sore? Keep moving",body:"Some soreness 1–2 days after training is normal. A light walk, cycle or stretch helps more than lying on the couch. Sharp pain is different: stop and get it checked."},
 {id:"t17",cat:"Mindset",title:"Compete with last week",body:"Comparing yourself to people online is pointless. The only comparison that counts is your own numbers from three weeks ago."},
 {id:"t18",cat:"Training tip",title:"Sport counts too",body:"Basketball, touch or a surf all count as training. Log them under Other with an honest intensity so your weekly totals are accurate."},
 {id:"t19",cat:"Training tip",title:"Mind–muscle connection",body:"On curls, pushdowns and lateral raises, slow down and focus on the muscle doing the work. Lighter weight, better squeeze, more growth."},
 {id:"t20",cat:"Training to failure",title:"Failure: the upside",body:"Going to failure (the point where you can't do another clean rep) has real benefits when you use it well:",points:["Guaranteed stimulus: you recruit every available muscle fibre and get the tension that drives growth.","Time efficient: you get a lot of muscle activation from fewer sets.","Mental toughness: you learn what true intensity feels like."]},
 {id:"t21",cat:"Training to failure",title:"Failure: the cost",body:"Doing it on every set has a price:",points:["Fatigue builds fast. Failure on your first exercise drains strength and coordination for everything after it.","Form breaks down when you're exhausted, which raises injury risk on heavy lifts like bench press, Romanian deadlifts and split squats.","Recovery takes longer, so you can do less quality training across the week."]},
 {id:"t22",cat:"Training to failure",title:"Leave 1–3 reps in reserve",body:"Most sports science recommends finishing most sets with 1–3 reps left in the tank (\"reps in reserve\"). You still get almost all the growth benefit with far less fatigue. Save true failure for the last set of an exercise, or for safer isolation moves like curls, pushdowns and lateral raises."},
 {id:"t23",cat:"Training to failure",title:"Try a no-failure week",body:"Every 4–6 weeks, do a full week where no set goes to failure: same exercises and weights, but stop each set with 2 reps left. Fatigue clears, joints get a rest, and you'll often come back stronger the week after. Leave the 'To failure' boxes unticked and see how you feel.",again:2},
 // ---- Just for fun
 {id:"f1",cat:"Just for fun",title:"Friends don't let friends skip Leg Day",body:"A big chest and arms on top of skinny legs is the classic 'light bulb' build. Every gym has one. Don't be the light bulb. Your legs carry you up the court, off the ground for rebounds and through every sprint.",again:1},
 {id:"f2",cat:"Just for fun",title:"Warning: too much muscle",body:"Side effects of very big arms may include: struggling to scratch your own back, T-shirts that fit nowhere else, and turning sideways through doors. The cure for the first one is shoulder mobility. Stretch your lats and pecs after every Push and Pull day."},
 {id:"f3",cat:"Just for fun",title:"Big muscles, slow feet?",body:"Huge muscles look great until someone half your size beats you down the court. Strength without speed is a sports car stuck in first gear. Add some sprints or jumps once a week so all that muscle can actually move fast."},
 {id:"f4",cat:"Just for fun",title:"Grunting adds 0 kg",body:"Scientific fact: the loudness of a grunt has no effect on the weight on the bar. A sharp breath out on the hard part of the lift helps. A sound like a walrus giving birth does not."},
 {id:"f5",cat:"Just for fun",title:"The mirror is not a spotter",body:"Checking your form in the mirror is smart. Checking your hair between every set is not. The mirror won't catch the bar if you fail a bench rep, so get a real spotter for heavy sets."},
 {id:"f6",cat:"Just for fun",title:"Re-rack your weights",body:"Your mum doesn't work at the gym. Put your plates and dumbbells back where they live. It's also free extra exercise: carrying plates is basically a farmer's walk."},
 {id:"f7",cat:"Just for fun",title:"Gym selfies don't count as sets",body:"Unfortunately, photos of your pump do not appear in the training load graph. Log the sets instead. The graph is a much more honest friend than Instagram."},
 {id:"f8",cat:"Just for fun",title:"Calves: the stubborn ones",body:"Calves are famous for refusing to grow because they work all day just walking around. They need a full stretch at the bottom, a pause at the top and high reps (12–20). Or, as gym legend has it, choose taller parents."},
 {id:"f9",cat:"Just for fun",title:"Leg Day II: The Legs Strike Back",body:"Sequels are usually worse, but a second leg session in the week is the exception. If your legs are lagging, try a short extra session: split squats, RDLs and some jumps. Your future self running a fast break will thank you."},
 {id:"f10",cat:"Just for fun",title:"No curls in the squat rack",body:"The squat rack is for squats, presses and pull-ups. Doing curls in it is the gym equivalent of parking across two spaces. Grab some dumbbells or the EZ bar instead."},
 {id:"f11",cat:"Just for fun",title:"The bar doesn't care about your ego",body:"Loading on more than you can lift with good form doesn't impress anyone, especially your lower back. Leave the ego at the door and let the progress graph do the bragging."},
 {id:"f12",cat:"Just for fun",title:"Wipe the bench",body:"Nobody wants to lie in your sweat puddle. A quick wipe after each machine is basic gym manners, and you'd want the same from the person before you."},
 {id:"f13",cat:"Just for fun",title:"Rest days aren't lazy days",body:"Telling people you're 'actively growing muscle' while lying on the couch is technically true. Muscles grow during recovery, not during the workout. Just make sure the couch day includes a walk and some stretching."},
 {id:"f14",cat:"Just for fun",title:"Skip day vs skip Leg Day",body:"Missed a session? Fine. Missed only Leg Day five weeks in a row? The training calendar can see you. It's colour-coded. Yellow is Legs. There should be some yellow."},
 {id:"f15",cat:"Just for fun",title:"Arms are not a personality",body:"Big arms are fun. But the best athletes are strong everywhere: legs, back, core and grip. Build the whole machine, not just the bits that show in a T-shirt."},
 // ---- Speed & agility
 {id:"s1",cat:"Speed & agility",title:"Why speed work matters",body:"Strength makes you powerful; speed work teaches your body to use that power quickly. Once a week, add 10–15 minutes of sprints, jumps or agility drills, done while you're fresh, before weights.",again:1},
 {id:"s2",cat:"Speed & agility",title:"10 m acceleration sprints",body:"Most of basketball is short bursts. Do 6–8 sprints of 10 m from a standing start, walking back to recover fully each time. Quality over quantity: every rep should be fast."},
 {id:"s3",cat:"Speed & agility",title:"The 5-10-5 shuttle",body:"Start in the middle, sprint 5 m right and touch the line, 10 m left and touch, then 5 m back through the middle. It trains stopping and changing direction. Time yourself and try to beat it each month."},
 {id:"s4",cat:"Speed & agility",title:"Defensive slides",body:"Stay low, chest up, feet wide and don't cross them. Slide 5 m each way for 20 seconds, rest 40 s, repeat 6 times. Builds the hip and leg endurance that keeps you in front of your opponent."},
 {id:"s5",cat:"Speed & agility",title:"Skipping rope",body:"5 minutes of skipping improves foot speed, ankle stiffness and coordination, and it's a great warm-up. Start with 30 s on, 30 s off. Work up to double-unders if you're keen."},
 {id:"s6",cat:"Speed & agility",title:"Broad jumps",body:"Swing your arms and jump forward as far as you can, landing softly on both feet. 4 sets of 4, with full rest. Great for explosive hip power. Measure your best jump and track it."},
 {id:"s7",cat:"Speed & agility",title:"A-skips",body:"Skip forward driving one knee up to hip height while the other foot strikes under your hips. A sprint coach's favourite for teaching good running mechanics. 3 × 20 m in your warm-up."},
 {id:"s8",cat:"Speed & agility",title:"Hill sprints",body:"Find a short, steep hill and sprint up for 8–10 seconds, walking back down. The hill forces good sprint posture and builds power with less impact on your legs. 6–8 reps is plenty."},
 {id:"s9",cat:"Speed & agility",title:"Reaction drills",body:"Have a friend point left or right (or drop a tennis ball) and react as fast as you can. Games are about reacting, not just running in straight lines."},
 {id:"s10",cat:"Speed & agility",title:"Rest fully between sprints",body:"Speed work isn't cardio. Rest 60–90 seconds between short sprints so each one is at top speed. If you're puffing hard, you're training fitness, not speed."},
 {id:"s11",cat:"Speed & agility",title:"Pogo hops",body:"Small, fast bounces on the balls of your feet with stiff ankles, like a pogo stick. 3 × 20. Builds the springy ankles that make you quicker off the ground."},
 {id:"s12",cat:"Speed & agility",title:"Lateral shuffle to sprint",body:"Shuffle sideways for 3 steps, then turn and sprint 10 m. Mimics recovering on defence and breaking on a fast break. 6 reps each direction."},
 // ---- Quotes
 {id:"q11",cat:"Quote",title:"Discipline is freedom",quote:"Only the disciplined ones in life are free.",by:"Eliud Kipchoge, marathon world record holder",body:"Kipchoge ran the first sub-2-hour marathon by doing simple things consistently for years. Turning up three times a week is your version of that."},
 {id:"q12",cat:"Quote",title:"Focus on what you can do",quote:"Don't let what you cannot do interfere with what you can do.",by:"John Wooden, basketball coach",body:"Sore shoulder? Train legs. No gym this week? Do a run or push-ups at home. There's always something you can do."},
 {id:"q13",cat:"Quote",title:"Pressure is an opportunity",quote:"Everything negative – pressure, challenges – is all an opportunity for me to rise.",by:"Kobe Bryant",body:"A tough PB Week or a heavy set you're nervous about is exactly where you get better."},
 {id:"q14",cat:"Quote",title:"How you bounce back",quote:"I really think a champion is defined not by their wins but by how they can recover when they fall.",by:"Serena Williams",body:"Missed sessions, bad weeks and failed lifts happen to everyone. Coming back is what counts."},
 {id:"q15",cat:"Quote",title:"Dream big",quote:"You can't put a limit on anything. The more you dream, the farther you get.",by:"Michael Phelps",body:"Set a big goal for the year, then break it into small steps you can see on your graphs."},
 {id:"q16",cat:"Quote",title:"Practice like it matters",quote:"Don't practice until you get it right. Practice until you can't get it wrong.",by:"Common coaching saying",body:"Good technique on every rep, not just the first few, is what makes a lift safe when the weight gets heavy."},
 // ---- Nutrition
 {id:"n13",cat:"Nutrition",title:"Food first, not powders",body:"Growing athletes can get all the protein they need from normal food: meat, fish, eggs, milk, yoghurt, beans and nuts. Supplements are expensive and not needed. Spend the money on good groceries."},
 {id:"n14",cat:"Nutrition",title:"Pre-training snack",body:"Training on an empty stomach drains strength. 1–2 hours before the gym, have something easy like a banana and toast, yoghurt and muesli, or a sandwich."},
 {id:"n15",cat:"Nutrition",title:"Calcium for strong bones",body:"Teenage years are when you build most of your bone strength for life. Milk, yoghurt, cheese and calcium-fortified alternatives help. Lifting weights helps too."},
 {id:"n16",cat:"Nutrition",title:"Iron for energy",body:"Low iron makes you tired and flat. Red meat, chicken, eggs, beans, spinach and fortified cereals are good sources. Vitamin C (fruit, capsicum) helps you absorb iron from plants."},
 {id:"n17",cat:"Nutrition",title:"Don't skip meals",body:"Skipping breakfast or lunch makes it much harder to eat enough to grow and recover. Regular meals and snacks keep energy steady for school, sport and the gym."},
 {id:"n18",cat:"Nutrition",title:"Kūmara power",body:"Kūmara, potatoes and rice are cheap, filling carbs that refuel your muscles. A big serve with dinner after a hard day is ideal."},
 {id:"n19",cat:"Nutrition",title:"Sports drinks: only sometimes",body:"For a gym session under an hour, water is all you need. Sports drinks are for long, sweaty sessions or tournaments. Otherwise they're just expensive lolly water."},
 {id:"n20",cat:"Nutrition",title:"Hot day hydration",body:"On hot or humid days you sweat a lot more. Drink before you're thirsty, and add a pinch of salt or a salty snack after long sessions to replace what you've lost."},
 {id:"n21",cat:"Nutrition",title:"Learn three meals",body:"Learn to cook three simple meals: say a stir-fry, spag bol and an omelette. It's one of the most useful fitness skills there is, and future flatmates will love you."},
 {id:"n22",cat:"Nutrition",title:"Evening protein",body:"A protein snack before bed, like milk, yoghurt or a cheese toastie, gives your muscles building blocks for overnight recovery."},
 {id:"n23",cat:"Nutrition",title:"Fruit is fast fuel",body:"Bananas, apples, oranges and grapes are perfect quick energy before training or sport, and they come with vitamins, fibre and water."},
 {id:"n24",cat:"Nutrition",title:"Eggs: the cheap hero",body:"Eggs are one of the best-value proteins you can buy, and they cook in minutes: scrambled, boiled or in an omelette with veggies."},
 // ---- Long and Strong
 {id:"m11",cat:"Long and Strong",title:"World's greatest stretch",body:"Lunge forward, put both hands inside your front foot, rotate your top arm to the ceiling, then reach back down. Hits hips, hamstrings and upper back in one move. 5 each side before any session."},
 {id:"m12",cat:"Long and Strong",title:"Foam rolling",body:"Rolling your quads, calves and upper back for a minute each can ease tightness before or after training. Go slowly and pause on tight spots. It should feel like a firm massage, not torture."},
 {id:"m13",cat:"Long and Strong",title:"Band pull-aparts",body:"Hold a resistance band at shoulder height and pull it apart until it touches your chest. 2 × 15 between pressing sets keeps shoulders healthy and posture tall."},
 {id:"m14",cat:"Long and Strong",title:"Pigeon stretch",body:"From a push-up position, bring one knee forward behind your hand and lower your hips. Opens up tight glutes and hips after Legs day. Hold 45 s each side."},
 {id:"m15",cat:"Long and Strong",title:"Cat–cow",body:"On hands and knees, slowly arch your back up like a cat, then drop your belly and lift your head. 10 slow reps loosen a stiff spine before training."},
 {id:"m16",cat:"Long and Strong",title:"Calf stretch on a step",body:"Stand on a step with your heels hanging off and let them drop slowly. Hold 30 s straight-legged, then 30 s with knees bent. Tight calves can lead to sore shins and Achilles."},
 {id:"m17",cat:"Long and Strong",title:"Breathe into the stretch",body:"Holding your breath makes muscles tense. Take slow breaths and let the stretch deepen a little each time you breathe out."},
 {id:"m18",cat:"Long and Strong",title:"Wrist warm-up",body:"Pressing and push-ups load the wrists. Before Push day, do 10 wrist circles each way and gently rock forward and back on your palms."},
 {id:"m19",cat:"Long and Strong",title:"Try a yoga session",body:"One 20–30 minute yoga video a week is a great way to work on flexibility, balance and breathing. Plenty of free 'yoga for athletes' sessions are online. Log it under Other."},
 {id:"m20",cat:"Long and Strong",title:"Long and strong, again",body:"Tight muscles can't produce their full power through a full range. Flexible, strong muscles move better and get injured less. 10 minutes of stretching after training is the cheapest performance boost there is.",again:1},
 // ---- Try this exercise
 {id:"e14",cat:"Try this exercise",title:"Single-leg RDL",body:"Stand on one leg holding a dumbbell and hinge forward until your body is level, then stand back up. Builds hamstrings, glutes and balance, which is great for jumping and landing."},
 {id:"e15",cat:"Try this exercise",title:"Reverse lunges",body:"Step backwards into a lunge instead of forwards. Easier on the knees and great for single-leg strength. Try 3 × 10 each leg on Legs day."},
 {id:"e16",cat:"Try this exercise",title:"Chest-supported row",body:"Lie face-down on an incline bench and row dumbbells up. Your lower back gets a rest and your upper back has to do all the work."},
 {id:"e17",cat:"Try this exercise",title:"Cable crossover",body:"Set the cables high and bring the handles together in front of your hips with a slight bend in the elbows. A great finisher for the chest after pressing."},
 {id:"e18",cat:"Try this exercise",title:"Dead bug",body:"Lie on your back with arms up and knees bent at 90°. Slowly lower the opposite arm and leg while keeping your lower back pressed to the floor. Teaches the core to stay solid while limbs move."},
 {id:"e19",cat:"Try this exercise",title:"Hollow body hold",body:"Lie on your back, lift your shoulders and legs a little off the floor and press your lower back down. Hold for 20–30 s. A gymnast's secret to a strong core."},
 {id:"e20",cat:"Try this exercise",title:"Side plank",body:"Balance on one forearm and the side of your foot, body in a straight line. 3 × 30 s each side builds the side core muscles that protect your back when you twist and land."},
 {id:"e21",cat:"Try this exercise",title:"Cable crunch",body:"Kneel facing a high cable with a rope, and crunch down by curling your ribs towards your hips. A good way to add weight to ab training alongside your decline crunches."},
 {id:"e22",cat:"Try this exercise",title:"Seated dumbbell Z-press",body:"Sit on the floor with legs straight out and press dumbbells overhead. No leaning back allowed, so your core and shoulders do all the work."},
 {id:"e23",cat:"Try this exercise",title:"Step-ups",body:"Step onto a box or bench with one foot and drive up until standing tall. Keep the work in the front leg. Great single-leg strength for jumping."},
 {id:"e24",cat:"Try this exercise",title:"Close-grip push-ups",body:"Hands just inside shoulder width, elbows tucked. Targets triceps and chest, and works anywhere: no gym needed."},
 {id:"e25",cat:"Try this exercise",title:"Rear delt fly",body:"Bend forward and raise light dumbbells out to the side. The back of the shoulder is often weak compared to the front, and this balances it out."},
 // ---- Dynamic work
 {id:"d11",cat:"Dynamic work",title:"Rotational med ball throw",body:"Stand side-on to a wall and throw a medicine ball into it by rotating hard through your hips. Builds rotational power for passing and shooting. 3 × 6 each side."},
 {id:"d12",cat:"Dynamic work",title:"Overhead med ball throw",body:"Hold a medicine ball overhead, step forward and throw it as far as you can. Great full-body power, especially if you play a throwing sport."},
 {id:"d13",cat:"Dynamic work",title:"Skater jumps",body:"Leap sideways from one leg to the other, landing softly and holding for a second. Builds the lateral power and balance used in cutting and defence."},
 {id:"d14",cat:"Dynamic work",title:"Jump squats",body:"Bodyweight squat, then explode up as high as you can and land softly. 3 × 6 before Legs day wakes up your fast-twitch muscles."},
 {id:"d15",cat:"Dynamic work",title:"Plyo push-ups",body:"Push up hard enough that your hands leave the floor, then land softly. Upper-body power for boxing out and fending off. Start with 3 × 5."},
 {id:"d16",cat:"Dynamic work",title:"Kettlebell goblet carry",body:"Hold a kettlebell at your chest and walk 30 m with tall posture. Your core works hard to stay upright. A great finisher."},
 // ---- Training tips
 {id:"t24",cat:"Training tip",title:"Double progression",body:"Pick a rep range like 8–12. When you hit 12 reps on every set, add a little weight and drop back to 8. Repeat. It's the simplest way to keep progressing."},
 {id:"t25",cat:"Training tip",title:"Film your lifts",body:"Ask a mate to film a set from the side now and then. You'll spot things you can't feel, like a rounded back on RDLs or bouncing the bar on bench."},
 {id:"t26",cat:"Training tip",title:"Always use a spotter for heavy bench",body:"Never go near your max on bench press without a spotter, or use the safety bars in a rack. It takes ten seconds to ask, and it's what experienced lifters do."},
 {id:"t27",cat:"Training tip",title:"One side at a time",body:"Single-arm and single-leg exercises (split squats, one-arm rows) expose and fix strength differences between sides, like your weaker right arm."},
 {id:"t28",cat:"Training tip",title:"How many sets?",body:"Around 10–20 hard sets per muscle group per week is the sweet spot for most people. More isn't always better if you can't recover from it."},
 {id:"t29",cat:"Training tip",title:"Ramp up your warm-up",body:"Before your heaviest lift, try: empty bar × 10, 50% × 8, 70% × 5, 85% × 2, then your working sets. Your joints and nervous system will be ready."},
 {id:"t30",cat:"Training tip",title:"Breathe out on the effort",body:"Breathe in on the easy part (lowering) and out on the hard part (lifting). For very heavy sets, brace and hold for the rep, then breathe at the top."},
 {id:"t31",cat:"Training tip",title:"Train your grip",body:"A weak grip limits rows, pulldowns and deadlifts. Farmer's carries, dead hangs and thick-handled holds build it up quickly."},
 {id:"t32",cat:"Training tip",title:"Same exercise, small tweaks",body:"Changing grip width, foot position or the bench angle shifts the work to slightly different muscles. Small tweaks can freshen up a program without starting over."},
 {id:"t33",cat:"Training tip",title:"Short on time?",body:"Got 30 minutes? Do just the first two exercises of your normal day with full effort. A short session beats no session every time."},
 // ---- Recovery & mindset
 {id:"r1",cat:"Recovery",title:"Screens off before bed",body:"Phone light and scrolling keep your brain awake. Try putting it away 30 minutes before bed. Better sleep means better recovery and more energy in the gym."},
 {id:"r2",cat:"Recovery",title:"Soreness vs pain",body:"Dull, achy muscles a day or two after training is normal. Sharp, stabbing or joint pain is not. If something hurts in a sharp way, stop and get it checked by a physio or doctor."},
 {id:"r3",cat:"Recovery",title:"Exam weeks",body:"During exams, stress and late nights cut recovery. It's fine to train lighter or less often. Even short sessions help focus and mood."},
 {id:"r4",cat:"Recovery",title:"Active recovery",body:"The day after a hard session, an easy walk, swim or bike ride gets blood flowing and helps soreness ease faster than doing nothing."},
 {id:"r5",cat:"Recovery",title:"Listen to your body",body:"Feeling flat, sore everywhere and unmotivated for several sessions in a row is a sign to back off for a few days. Your energy ratings will show the pattern."},
 {id:"r6",cat:"Recovery",title:"Cold showers?",body:"Ice baths and cold showers can make you feel fresh, but straight after weights they may slightly reduce muscle growth. Save them for tournaments or game days."},
 {id:"k1",cat:"Mindset",title:"Celebrate small wins",body:"An extra rep, 2.5 kg more, or a session you almost skipped: they all count. Big results are just lots of small wins added together."},
 {id:"k2",cat:"Mindset",title:"Set a goal for PB Week",body:"Before each PB Week, pick one number you want to beat, like one more pull-up or 2.5 kg on bench. A clear target makes training more focused."},
 {id:"k3",cat:"Mindset",title:"Music matters",body:"Studies show upbeat music can make hard training feel easier. Build a gym playlist for your heaviest sets."},
 {id:"k4",cat:"Mindset",title:"Train with a mate",body:"A training partner keeps you turning up, can spot you on heavy sets and makes sessions more fun. Healthy competition never hurts either."},
 {id:"k5",cat:"Mindset",title:"Your body, your timeline",body:"Everyone grows and develops at different rates, especially in the teenage years. Compare yourself only with your own graphs."},
 {id:"k6",cat:"Mindset",title:"Be patient",body:"Real muscle growth takes months, not weeks. Look back at your graphs from three months ago: that's where progress shows."},
 {id:"k7",cat:"Mindset",title:"Have fun with it",body:"The best program is the one you enjoy enough to keep doing. Try new exercises, play sport, mix it up. Fitness is for life, not just for this term."}
];
const TIP_BY_ID = Object.fromEntries(TIPS.map(t=>[t.id,t]));
/* Build a mixed sequence (round-robin by category) then slot repeats in later */
const TIP_SEQ = (()=>{
  // Spread every category evenly through the deck: each tip gets a position (i+0.5)/n within its category
  const cats={}; TIPS.forEach(t=>{(cats[t.cat]=cats[t.cat]||[]).push(t.id)});
  const order=Object.keys(cats), items=[];
  order.forEach((c,ci)=>cats[c].forEach((id,i)=>items.push({id,k:(i+0.5)/cats[c].length+ci*1e-4})));
  const seq=items.sort((x,y)=>x.k-y.k).map(x=>x.id);
  seq.splice(seq.indexOf("m1"),1); seq.unshift("m1");
  const repeats=[]; TIPS.forEach(t=>{for(let k=1;k<=(t.again||0);k++) repeats.push({id:t.id,k})});
  repeats.sort((a,b)=>a.k-b.k);
  repeats.forEach((r,i)=>{ const first=seq.indexOf(r.id), gap=Math.round(seq.length/((TIP_BY_ID[r.id].again||1)+1));
    seq.splice(Math.min(seq.length, first+gap*r.k+(i%5)),0,r.id); });
  return seq;
})();

function monthsOld(dob,date){return (parseYmd(date)-parseYmd(dob))/(864e5*30.4375)}
function normCdf(z){const x=Math.abs(z)/Math.SQRT2,t=1/(1+0.3275911*x);const y=1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return z>=0?(1+y)/2:(1-y)/2}
function hfaAt(m){const f0=HFA_BOYS[0][0],l=HFA_BOYS[HFA_BOYS.length-1][0];if(m<f0||m>l)return null;const i=Math.min(HFA_BOYS.length-2,Math.floor(m)-f0),a=HFA_BOYS[i],b=HFA_BOYS[i+1],f=m-a[0];return{M:a[1]+(b[1]-a[1])*f,S:a[2]+(b[2]-a[2])*f}}
function heightPct(cm,date){if(!S.profile||!S.profile.dob||cm==null)return null;const m=monthsOld(S.profile.dob,date),r=hfaAt(m);if(!r)return null;const z=(cm/r.M-1)/r.S;return{z,p:Math.min(99.9,Math.max(0.1,normCdf(z)*100)),M:r.M,months:m}}

const LS_KEY="ollie-training-log-v1";
const S={sessions:[],checkins:[],profile:null,popups:{},mode:"loading",ready:false};
let DB=null;
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS_KEY)||"null");if(d){S.sessions=d.sessions||[];S.checkins=d.checkins||[];S.profile=d.profile||null;S.popups=d.popups||{}}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({sessions:S.sessions,checkins:S.checkins,profile:S.profile,popups:S.popups}))}catch(e){}}
function goLocal(reason){ if(S.mode==="local")return; S.mode="local"; DB=null; saveLocal(); updateNote(); if(reason) toast(reason); }
async function writeDoc(col,id,data){
  saveLocal();
  if(S.mode!=="cloud"||!DB) return;
  try{ await DB.collection(col).doc(id).set(data); }
  catch(e){
    if(e&&e.code==="unavailable"){ await new Promise(r=>setTimeout(r,600+Math.random()*600)); try{await DB.collection(col).doc(id).set(data);return}catch(_){} }
    goLocal("Couldn't reach the shared log, so this is saved on this device only.");
  }
}
async function deleteDoc(col,id){ saveLocal(); if(S.mode!=="cloud"||!DB) return; try{await DB.collection(col).doc(id).delete()}catch(e){goLocal("Deleted on this device only.")} }
function upsert(list,obj){const i=list.findIndex(x=>x.id===obj.id); if(i>=0) list[i]=obj; else list.push(obj)}
async function saveSession(s){upsert(S.sessions,s);renderAll();await writeDoc("sessions",s.id,s)}
async function removeSession(id){S.sessions=S.sessions.filter(x=>x.id!==id);renderAll();await deleteDoc("sessions",id)}
async function saveCheckin(c){upsert(S.checkins,c);renderAll();await writeDoc("checkins",c.id,c)}
async function saveProfile(p){S.profile=p;renderAll();await writeDoc("meta","profile",p)}
async function savePopups(p){S.popups=p;saveLocal();await writeDoc("meta","popups",p)}
function updateNote(){
  const n=$("#storage-note");
  n.textContent = S.mode==="cloud" ? "Saved to Ollie's training log online, so it's the same on every device." :
                  S.mode==="local" ? "Saved on this device only. Download a backup every few weeks from Performance Tracking." : "Loading…";
}

function pbInfo(){
  // PB Week = every 3rd week counted from the profile start date (weeks 3, 6, 9 …)
  if(!S.profile||!S.profile.start) return null;
  const t=todayStr(); const days=Math.max(0,daysBetween(S.profile.start,t)); const wk=Math.floor(days/7);
  const live = (wk+1)%3===0;
  const cycle = Math.floor((wk+1)/3);
  if(live){ const end=addDays(S.profile.start,wk*7+6); return {live:true,cycle,end,daysLeft:daysBetween(t,end)} }
  const nextWk = (Math.floor((wk+1)/3)+1)*3-1; const start=addDays(S.profile.start,nextWk*7);
  return {live:false,cycle:cycle+1,start,inDays:daysBetween(t,start)};
}
function lastSetsFor(name){ for(const s of sortedSessions()){ if(s.type!=="gym")continue; const e=s.exercises.find(x=>x.name===name); if(e) return {e,dt:s.dt}; } return null; }

function syncCopy(card,name){
  const st=exState(name); if(!st.copy) return;
  for(let i=1;i<st.n;i++){st.sets[i].w=st.sets[0].w;st.sets[i].r=st.sets[0].r;}
  $$(".set",card).forEach((row,i)=>{ if(i>0){ $('[data-f="w"]',row).value=st.sets[0].w; $('[data-f="r"]',row).value=st.sets[0].r; } });
}
function otherList(sp){
  const base=EXERCISES[sp].other, seen=new Set([...EXERCISES[sp].normal,...base]), extra=[];
  const fromSplits=sp==="free"?Object.keys(SPLITS):sp==="pushpull"?["push","pull","pushpull"]:[sp];
  S.sessions.forEach(s=>{ if(s.type==="gym"&&fromSplits.includes(s.split)) s.exercises.forEach(e=>{ if(!seen.has(e.name)){seen.add(e.name);extra.push(e.name)} }) });
  F.extras[sp].forEach(n=>{ if(!seen.has(n)){seen.add(n);extra.push(n)} });
  return base.concat(extra);
}
function addCustom(){
  const inp=$("#custom-ex"), err=$("#custom-err"); let n=(inp&&inp.value||"").trim().replace(/\s+/g," ");

  n=n.charAt(0).toUpperCase()+n.slice(1); const sp=F.split;
  const all=[...EXERCISES.free.other,...otherList(sp)];
  const match=all.find(x=>x.toLowerCase()===n.toLowerCase()); if(match) n=match;
  if(EXERCISES[sp].normal.includes(n)){ if(err) err.textContent=`${n} is already in your normal ${SPLITS[sp]} workout.`; return; }
  if(!F.extras[sp].includes(n)) F.extras[sp].push(n);
  F.customOpen=false; renderInput(); toast(`${n} added to today's ${sp==="free"?"free":SPLITS[sp]} session`);
}

async function doSave(){
  const err=$("#in-err"); err.textContent="";
  if(!F.date){err.textContent="Enter the date of the workout.";$("#in-date")?.focus();return}
  if(!F.time){err.textContent="Enter the time of the workout.";$("#in-time")?.focus();return}
  const dt=`${F.date}T${F.time}`; const editing=!!F.editId;
  let s={id:F.editId||uid(),dt,created:F.editCreated||new Date().toISOString(),type:F.type};
  if(F.energy) s.energy=F.energy; if(F.sleep!=null) s.sleep=F.sleep; if(F.ate!=null) s.ate=F.ate; if(F.protein!=null) s.protein=F.protein;
  if(F.type==="gym"){
    const names=[...EXERCISES[F.split].normal,...F.extras[F.split]];
    const ex=[]; names.forEach(n=>{const st=F.ex[n]; if(!st||!st.inc) return;
      const sets=st.sets.map(x=>({w:num(x.w)??0,r:num(x.r)??0,f:!!x.f})).filter(x=>x.r>0);
      if(sets.length) ex.push({name:n,sets}); });
    if(!ex.length){err.textContent="Add reps to at least one exercise before saving.";return}
    s.split=F.split; s.exercises=ex; const gm=num(F.gym.min); if(gm) s.minutes=gm; if(F.gym.intensity) s.intensity=F.gym.intensity;
  } else if(F.type==="cardio"){
    const km=num(F.cardio.km),min=num(F.cardio.min);
    if(!min){err.textContent="Enter how many minutes it took.";return}
    if(!F.cardio.intensity){err.textContent="Choose an intensity from 1 to 6.";return}
    s.cardio={act:F.cardio.act,km,min,intensity:F.cardio.intensity};
  } else {
    const act=F.other.act.trim(),min=num(F.other.min);
    if(!act){err.textContent="Type what you did, e.g. Playing basketball.";return}
    if(!min){err.textContent="Enter how many minutes.";return}
    if(!F.other.intensity){err.textContent="Choose an intensity from 1 to 6.";return}
    s.other={act,min,intensity:F.other.intensity};
  }
  const label=F.type==="gym"?(F.split==="free"?"Free session":SPLITS[F.split]+" session"):F.type==="cardio"?F.cardio.act:"Activity";
  const found=s.type==="gym"?spotPBs(s):[];
  resetForm(); F.type=null; renderInput(); window.scrollTo({top:0,behavior:"smooth"});
  await saveSession(s); toast(`${label} ${editing?"updated":"saved"} for ${fmtDate(s.dt)}`);
  if(found.length) openNewPB(found,s.dt.slice(0,10));
}
/* Compare a gym session against the PB record and every earlier session */
function spotPBs(s){
  const prevMax={}, out=[];
  S.sessions.forEach(x=>{ if(x.type==="gym"&&x.id!==s.id) x.exercises.forEach(e=>e.sets.forEach(st=>{prevMax[e.name]=Math.max(prevMax[e.name]??-1,st.w||0)})) });
  s.exercises.forEach(e=>{

function calendar(){

function bindTrack(){

      let m=null; if(!S.profile){m=readMeasures(root);}
      close(); await saveProfile({dob,start});
      if(m&&[m.weight,m.height,m.bench,m.pullups,m.bicep,m.waist].some(x=>x!=null)) await saveCheckin({id:uid(),...m,kind:"start"});
      toast("Profile saved");
    }}});
}
function openCheckin(){
  const pi=pbInfo(), prev={};
  openModal({tag:pi&&pi.live?"PB Week":"Measurements",title:pi&&pi.live?"Record your PBs":"Log measurements",body:`
    <p>Leave a box blank if you didn't test it. Bench, pull-ups and right bicep replace the banner value only when they beat your best; weight, height and waist always show the latest.</p>
    ${measureFields(prev)}
    <div class="mf"><span class="err" id="m-err"></span><button type="button" class="btn gold" id="m-save">Save check-in</button></div>`,
    onMount:(root,close)=>{$("#m-save",root).onclick=async()=>{
      if(!$("#m-date",root).value){$("#m-err",root).textContent="Enter the date of these measurements.";return}
      const m=readMeasures(root); if(![m.weight,m.height,m.bench,m.pullups,m.bicep,m.waist].some(x=>x!=null)){$("#m-err",root).textContent="Fill in at least one number.";return}
      const before={bench:best("bench")?.bench,pullups:best("pullups")?.pullups,bicep:best("bicep")?.bicep};
      await saveCheckin({id:uid(),...m,kind:pi&&pi.live?"pbweek":"check"});
      const rows=[["bench","Bench press","kg"],["pullups","Pull-ups","reps"],["bicep","Biceps","cm"]].filter(([k])=>m[k]!=null).map(([k,l,u])=>{
        const b=before[k], isNew=b==null||m[k]>b; return `<div class="${isNew?"new":""}">${l}: ${m[k]} ${u} ${isNew?(b==null?"· first record":`· NEW PB (+${fmtN(m[k]-b,2)} ${u})`):`· best is still ${b} ${u}`}</div>`;});
      const any=rows.some(r=>r.includes("NEW PB"));
      $(".mb",root).innerHTML=`<p>${any?"New personal bests! The banner has been updated.":"Check-in saved. Your graphs have been updated."}</p><div class="pbres">${rows.join("")||"<div>Body measurements saved.</div>"}</div><div class="mf"><span></span><button type="button" class="btn primary" id="m-done">Done</button></div>`;
      $("#m-title",root).textContent=any?"PB smashed":"Saved"; $("#m-done",root).onclick=close;
    }}});
}
function openPbWeek(pi){
  openModal({tag:"Every third week",title:"PB – Personal Best Week",locked:true,body:`
    <p>This week, test and record your numbers: <b>weight, height, bench press max, pull-ups max, right bicep (flexed) and waist at the belly button</b>. Any new best goes straight into the banner.</p>
    <p class="hint">Warm up properly before max attempts and have a spotter for bench. You have until ${fmtDate(pi.end)}.</p>
    <div class="mf"><button type="button" class="btn ghost" id="pb-later">Remind me later this week</button><button type="button" class="btn gold" id="pb-go">Enter my numbers</button></div>`,
    onMount:(root,close)=>{
      const ack=async()=>{await savePopups({...S.popups,pbAck:pi.cycle})};
      $("#pb-go",root).onclick=async()=>{close();await ack();openCheckin()};
      $("#pb-later",root).onclick=async()=>{close();await ack()};
    }});
}
function openCoach(n){
  openModal({tag:"Coach's note",title:n.title,locked:true,body:`${n.html||`<p>${esc(n.t)}</p>`}<div class="mf"><label class="readbox"><input type="checkbox" id="tip-read">I have read this</label><button type="button" class="btn primary" id="tip-close" disabled>Close</button></div>`,
    onMount:(root,close)=>{ const cb=$("#tip-read",root),bt=$("#tip-close",root); cb.onchange=()=>{bt.disabled=!cb.checked};
      bt.onclick=async()=>{ if(!cb.checked) return; close(); const p=S.popups;
        await savePopups({...p,lastTip:todayStr(),tipCount:(p.tipCount||0)+1,coachLog:{...(p.coachLog||{}),[n.key]:todayStr()}}); renderAll(); }; }});
}
/* Re-open the most recent tip at any time (no tick needed, nothing saved) */
function openTodaysTip(){
  const h=(S.popups.history||[]); const t=h.length?TIP_BY_ID[h[h.length-1].id]:TIP_BY_ID[TIP_SEQ[(S.popups.tipIdx||0)%TIP_SEQ.length]];
  if(!t) return;
  openModal({tag:t.cat,title:t.title,body:(t.quote?`<blockquote>“${esc(t.quote)}”</blockquote><cite>${esc(t.by)}</cite>`:"")+`<p>${esc(t.body)}</p>`+(t.points?`<ul style="margin:0;padding-left:20px;display:grid;gap:6px">${t.points.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"")+
    `<div class="mf"><span class="hint">A new tip pops up the first time you open the log each day.</span><button type="button" class="btn primary" id="tt-close">Close</button></div>`,
    onMount:(root,close)=>{$("#tt-close",root).onclick=close}});
}
function openTip(tip,idx,forced){
  const body = (tip.quote?`<blockquote>“${esc(tip.quote)}”</blockquote><cite>${esc(tip.by)}</cite>`:"")+`<p>${esc(tip.body)}</p>`+(tip.points?`<ul style="margin:0;padding-left:20px;display:grid;gap:6px">${tip.points.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"")+
    `<div class="mf"><label class="readbox"><input type="checkbox" id="tip-read">I have read this</label><button type="button" class="btn primary" id="tip-close" disabled>Close</button></div>`;
  openModal({tag:tip.cat,title:tip.title,locked:true,body,onMount:(root,close)=>{
    const cb=$("#tip-read",root),bt=$("#tip-close",root); cb.onchange=()=>{bt.disabled=!cb.checked};
    bt.onclick=async()=>{ if(!cb.checked) return; close();
      const p=S.popups, hist=(p.history||[]).concat({id:tip.id,date:todayStr()}).slice(-60);
      const np={...p,tipIdx:forced&&TIP_SEQ[idx%TIP_SEQ.length]!==tip.id?idx:idx+1,lastTip:todayStr(),tipCount:(p.tipCount||0)+1,history:hist}; delete np.nextTip;
      await savePopups(np); renderAll(); };
  }});
}
let popupDay=null;
function runPopups(){
  // Runs on load and whenever the app comes back to the screen; acts once per calendar day
  const today=todayStr(); if(popupDay===today||$("#modal-root").innerHTML) return; popupDay=today;
  if(!S.profile){openSetup();return}
  const pi=pbInfo(); if(pi&&pi.live&&S.popups.pbAck!==pi.cycle){openPbWeek(pi);return}
  if(S.popups.nextTip&&TIP_BY_ID[S.popups.nextTip]){ openTip(TIP_BY_ID[S.popups.nextTip],S.popups.tipIdx||0,true); return; }
  const p=S.popups; // one pop-up a day: the first time the site is opened each day
  if(p.lastTip!==today){
    // A coaching note about a real imbalance takes the slot (each one at most every 14 days); otherwise the next tip in the deck
    const log=p.coachLog||{}, n=coachNotes().find(x=>!log[x.key]||daysBetween(log[x.key],todayStr())>=14);
    if(n){ openCoach(n); return; }
    const idx=(p.tipIdx||0); openTip(TIP_BY_ID[TIP_SEQ[idx%TIP_SEQ.length]],idx); }
}

/* =========================================================
   APP
   ========================================================= */
let view="input";
try{ const v=localStorage.getItem("ollie-view"); if(v==="track") view="track"; }catch(e){}
if(location.hash==="#tracking") view="track";
function setView(v){view=v;try{localStorage.setItem("ollie-view",v)}catch(e){}
  $("#tab-input").setAttribute("aria-selected",v==="input");$("#tab-track").setAttribute("aria-selected",v==="track");
  $("#view-input").hidden=v!=="input";$("#view-track").hidden=v!=="track"; if(v==="track") renderTrack();}
let rq=false;
function renderAll(){ if(rq) return; rq=true; requestAnimationFrame(()=>{rq=false; renderBanner(); if(view==="track") renderTrack(); }); }
$("#tab-input").onclick=()=>setView("input"); $("#tab-track").onclick=()=>setView("track");
$("#b-edit").onclick=openSetup;
$("#b-tip").onclick=openTodaysTip;
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&S.ready) runPopups(); });
window.addEventListener("pageshow",()=>{ if(S.ready) runPopups(); });
bindInput(); bindTrack(); renderInput(); setView(view); updateNote();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(view==="track")drawCharts()});
new MutationObserver(()=>{if(view==="track")drawCharts()}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
initStore();
</script>
